[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "timetable"
version = "0.1.0"
description = "Building a timetable with integer programming"
requires-python = ">=3.9"
dependencies = [
    "ortools>=9.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
timetable-smoke = "timetable.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
